services:
  eacapture:
    image: ghcr.io/hdslugger/eacapture:latest
    build: .                    # used by: docker compose up -d --build
    container_name: eacapture
    restart: unless-stopped
    network_mode: host          # needed for auto-discovery; optional if HDHR_IP is set
    environment:
      TZ: America/Los_Angeles   # change to your time zone
      # HDHR_IP: 192.168.1.100  # specify your HDHomeRun IP if on another network/VLAN
    volumes:
      - eacapture-data:/data

volumes:
  eacapture-data:
